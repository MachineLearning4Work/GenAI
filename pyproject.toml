[tool.poetry]
name = "crewai-business-plan-pipeline"
version = "0.1.0"
description = "Local CrewAI business-plan pipeline (teaching-friendly)"
authors = []
readme = "README.md"
packages = [{ include = "business_plan", from = "src" }]
include = ["src/business_plan/config/*.yaml"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.7"
boto3 = "^1.34"
requests = "^2.31"
fastapi = "^0.110"
uvicorn = { extras = ["standard"], version = "^0.31.1" }
crewai = "1.15.28"
pyyaml = "^6.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
httpx = "^0.28.1"

[tool.pytest.ini_options]
# Makes `python -m pytest` work from the repo root without setting PYTHONPATH,
# which is what the Jenkins test stage relies on.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.5"]
build-backend = "poetry.core.masonry.api"
